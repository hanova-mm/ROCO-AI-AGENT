<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCO — Choose an account</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 18%,rgba(123,155,255,.14),transparent 27%),
    radial-gradient(circle at 88% 82%,rgba(139,111,255,.12),transparent 30%),
    #f7f9fd;
  color:#17213a;
  display:grid;
  place-items:center;
  min-height:100vh;
  padding:24px;
}
.card{
  width:min(450px,100%);
  background:rgba(255,255,255,.97);
  border:1px solid rgba(35,45,70,.08);
  border-radius:24px;
  box-shadow:0 24px 70px rgba(42,55,95,.13);
  padding:40px 34px 31px;
  text-align:center;
}
.logo{
  width:68px;
  height:68px;
  border-radius:18px;
  object-fit:contain;
  display:block;
  margin:0 auto 14px;
  background:#eef2ff;
  border:1px solid #e1e6f5;
}
.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.8px;
  margin-bottom:30px;
}
h1{
  margin:0;
  font-size:28px;
  line-height:1.2;
  letter-spacing:-.8px;
  font-weight:650;
}
.subtitle{
  margin:10px 0 30px;
  color:#69738b;
  font-size:15px;
}
.roco-btn{
  width:100%;
  min-height:58px;
  border:1px solid #cfd9ff;
  border-radius:14px;
  background:#f7f9ff;
  color:#17213a;
  font-size:16px;
  font-weight:650;
  display:flex;
  align-items:center;
  gap:13px;
  padding:8px 16px;
  cursor:pointer;
  transition:.18s ease;
}
.roco-btn:hover{
  background:#eef3ff;
  border-color:#b8c7ff;
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(86,110,210,.10);
}
.roco-btn:active{transform:translateY(0)}
.button-logo{
  width:40px;
  height:40px;
  border-radius:11px;
  object-fit:contain;
  background:#e8edff;
  flex:none;
}
.button-text{flex:1;text-align:left}
.arrow{font-size:25px;color:#5f709d}
.divider{
  display:flex;
  align-items:center;
  gap:14px;
  color:#98a1b4;
  font-size:12px;
  font-weight:700;
  letter-spacing:.7px;
  margin:26px 0;
}
.divider:before,.divider:after{
  content:"";
  height:1px;
  background:#e4e8f0;
  flex:1;
}
.terms{
  margin:0;
  color:#8a93a6;
  font-size:12px;
  line-height:1.65;
}
.terms a{
  color:#3367d6;
  text-decoration:none;
  font-weight:600;
}
.terms a:hover{text-decoration:underline}
.status{
  display:none;
  margin-top:16px;
  padding:10px 12px;
  border-radius:10px;
  background:#eef2ff;
  color:#5368a3;
  font-size:13px;
}
@media(max-width:480px){
  body{padding:16px}
  .card{padding:32px 22px 26px;border-radius:20px}
  h1{font-size:25px}
}
</style>
</head>

<body>
<main class="card">

  <!-- YOUR TOP LOGO:
       Replace YOUR_LOGO_URL_HERE with the URL of your logo.
       Example: https://yourwebsite.com/logo.png
  -->
  <img
    class="logo"
    src="YOUR_LOGO_URL_HERE"
    alt="ROCO logo"
  >

  <div class="brand">ROCO</div>

  <h1>Choose an account</h1>
  <p class="subtitle">to continue to <strong>ROCO</strong></p>

  <button class="roco-btn" id="rocoBtn" type="button">

    <!-- YOUR BUTTON LOGO:
         Replace YOUR_LOGO_URL_HERE with your logo URL.
    -->
    <img
      class="button-logo"
      src="YOUR_LOGO_URL_HERE"
      alt=""
    >

    <span class="button-text">Continue with ROCO</span>
    <span class="arrow">→</span>
  </button>

  <div class="divider">OR</div>

  <p class="terms">
    By continuing, you agree to ROCO's
    <a href="#">Terms of Service</a>
    and
    <a href="#">Privacy Policy</a>.
  </p>

  <div class="status" id="status">
    Welcome to ROCO — account selection prototype.
  </div>

</main>

<script>
document.getElementById("rocoBtn").addEventListener("click", () => {
  const button = document.getElementById("rocoBtn");
  const status = document.getElementById("status");

  button.disabled = true;
  button.style.opacity = "0.7";
  button.querySelector(".button-text").textContent = "Opening ROCO...";
  button.querySelector(".arrow").textContent = "✓";

  setTimeout(() => {
    status.style.display = "block";
    button.disabled = false;
    button.style.opacity = "1";
    button.querySelector(".button-text").textContent = "Continue with ROCO";
    button.querySelector(".arrow").textContent = "→";
  }, 650);
});
</script>
</body>
</html>
